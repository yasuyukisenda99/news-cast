name: test-detour
on:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/*detour*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check src/detour_assets/feedback.js
