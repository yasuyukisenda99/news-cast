# ============================================================
# news-cast 設定ファイル
# ============================================================

podcast:
  title: "朝のAI・業界ニュース便"
  description: "AI・HubSpot・デジタルマーケティングから電子部品・産業機器まで、仕事に役立つ最新ニュースをAIホスト2人が毎朝コンパクトにお届けします。"
  author: "news-cast bot"
  base_url: "https://yasuyukisenda99.github.io/news-cast"
  language: "ja"
  episode_minutes: 8
  keep_episodes: 14

  # 番組の演出方針（台本生成AIへの指示。ここを書き換えるだけで雰囲気が変わります）
  style_notes: |
    この番組は「研究者 × ジャーナリスト」の対談形式です。
    - リサは技術と研究の文脈を押さえた解説役。専門用語は使うが必ず噛み砕く。
      「これは要するに〜ということです」「背景には〜という流れがあります」のように、
      ニュースの奥にある技術的な必然性や、これまでの経緯との繋がりを語る。
      断定を避け、確度の低い話は「まだ検証が必要ですが」と前置きする。
    - ケンタは取材者の視点を持つビジネス記者。技術そのものより
      「誰が得をするのか」「現場の何が変わるのか」「なぜ今なのか」を問う。
      リサの説明が抽象的なときは「つまり、現場レベルでは何が起きますか？」と
      具体化を促し、business impact に引き戻す役割を担う。
    - 二人は対等な議論相手。ケンタは素朴な疑問役ではなく、
      自分の取材経験を根拠に「私が取材した限りでは〜」と反論や補足をしてもよい。
    - 相槌だけの短い行を連発せず、一つの発言に中身を持たせる。
    - 過度に明るいノリや大げさな驚きは避け、落ち着いた知的な議論のトーンを保つ。

  # 構成（省略すると従来の4部構成になります）
  structure: |
    1. オープニング: 日付と番組名。今日の主題を一文で提示する
    2. 本日の深掘り: 最も重要な1〜2件を選び、5〜6往復かけて掘り下げる。
       ニュースの事実 → 技術的背景（リサ） → 産業へのインパクト（ケンタ）
       → 見立ての相違や留保、の順で議論を進める
    3. 関連トピック: 残りのニュースから2〜3件を、深掘りとの繋がりを示しながら短く紹介
    4. クロージング: 今日の議論で何が分かったかを一言ずつ述べて締める

news:
  hours_back: 48
  max_articles: 12
  google_news_locale: "en"

  google_news_queries:
    - "HubSpot AI"
    - "HubSpot AEO"
    - "HubSpot Breeze"
    - "HubSpot Agent Hub"
    - "AI エージェント マーケティング"
    - "MCP CRM marketing"
    - "AEO AI検索"
    - "生成AI 検索 マーケティング"
    - "GEO generative engine optimization"
    - "B2B マーケティング AI"
    - "電子部品 業界"
    - "FA 産業機器"

  rss_feeds:
    - "https://martech.org/feed/"
    - "https://searchengineland.com/feed"
    - "https://rsshub.app/deeplearning/the-batch"
    - "https://techcrunch.com/category/artificial-intelligence/feed/"
    - "https://www.theverge.com/ai-artificial-intelligence/rss/index.xml"

gemini:
  # 台本生成用モデル（上から順に試行）
  script_models:
    - "gemini-3.7-flash"
    - "gemini-3.6-flash"
    - "gemini-3.5-flash"

  # 音声合成の方式: "cloud"（Google Cloud TTS・推奨） / "gemini"（従来）
  tts_provider: "cloud"

  # Cloud TTS の設定
  cloud_tts:
    sample_rate: 24000
    gap_seconds: 0.35        # 発言と発言の間の無音（秒）

  # 2人のホスト設定
  hosts:
    - speaker: "Risa"
      display: "リサ"
      voice: "Charon"
      cloud_voice: "ja-JP-Chirp3-HD-Kore"
      speaking_rate: 1.01
      persona: "AI研究者。大規模言語モデルと強化学習が専門。技術の中身と研究の文脈から解説する"
      voice_direction: "落ち着いた低めの声。考えながら話す一定のテンポ。抑揚は控えめで理知的"
    - speaker: "Kenta"
      display: "ケンタ"
      voice: "Puck"
      cloud_voice: "ja-JP-Chirp3-HD-Puck"
      speaking_rate: 1.02
      persona: "ビジネスジャーナリスト。産業・企業取材が長い。技術の意味をビジネスの言葉に翻訳する"
      voice_direction: "明瞭でやや速めのテンポ。取材者らしい歯切れの良さ。抑揚は自然"

  # 以下は tts_provider: "gemini" のときだけ使われます
  tts_models:
    - "gemini-3.1-flash-tts-preview"
    - "gemini-2.5-flash-preview-tts"
  tts_chunk_chars: 1200
  tts_temperature: 0.2
