# ============================================================
# news-cast 設定ファイル
# ============================================================

podcast:
  title: "朝のAI・業界ニュース便"
  description: "AI・HubSpot・デジタルマーケティングから電子部品・産業機器まで、仕事に役立つ最新ニュースをAIホスト2人が毎朝コンパクトにお届けします。"
  author: "news-cast bot"
  base_url: "https://yasuyukisenda99.github.io/news-cast"
  language: "ja"
  episode_minutes: 8
  keep_episodes: 14

news:
  hours_back: 48
  max_articles: 12
  google_news_locale: "en"

  google_news_queries:
    - "HubSpot AI"
    - "HubSpot AEO"
    - "HubSpot Breeze"
    - "HubSpot Agent Hub"
    - "AI エージェント マーケティング"
    - "MCP CRM marketing"
    - "AEO AI検索"
    - "生成AI 検索 マーケティング"
    - "GEO generative engine optimization"
    - "B2B マーケティング AI"
    - "電子部品 業界"
    - "FA 産業機器"

  rss_feeds:
    - "https://martech.org/feed/"
    - "https://searchengineland.com/feed"
    - "https://rsshub.app/deeplearning/the-batch"
    - "https://techcrunch.com/category/artificial-intelligence/feed/"
    - "https://www.theverge.com/ai-artificial-intelligence/rss/index.xml"

gemini:
  # 台本生成用モデル（上から順に試行）
  script_models:
    - "gemini-3.7-flash"
    - "gemini-3.6-flash"
    - "gemini-3.5-flash"

  # 音声合成の方式: "cloud"（Google Cloud TTS・推奨） / "gemini"（従来）
  tts_provider: "cloud"

  # Cloud TTS の設定
  cloud_tts:
    sample_rate: 24000
    gap_seconds: 0.35        # 発言と発言の間の無音（秒）

  # 2人のホスト設定
  hosts:
    - speaker: "Aki"
      display: "アキ"
      voice: "Kore"
      cloud_voice: "ja-JP-Chirp3-HD-Kore"
      speaking_rate: 0.95
      persona: "落ち着いた知的な女性ホスト。要点を整理して伝えるのが得意"
      voice_direction: "30代女性。やや低めの落ち着いた声で、一定のゆっくりめのテンポ。抑揚は控えめ"
    - speaker: "Haru"
      display: "ハル"
      voice: "Puck"
      cloud_voice: "ja-JP-Chirp3-HD-Puck"
      speaking_rate: 1.0
      persona: "明るくテンポの良い男性ホスト。リスナー目線の素朴な疑問を投げる"
      voice_direction: "30代男性。落ち着いた声で、明るくリズム感のあるテンポ。抑揚は少し高め、共感力強い"

  # 以下は tts_provider: "gemini" のときだけ使われます
  tts_models:
    - "gemini-3.1-flash-tts-preview"
    - "gemini-2.5-flash-preview-tts"
  tts_chunk_chars: 1200
  tts_temperature: 0.2
