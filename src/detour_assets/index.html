<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title><link rel="stylesheet" href="style.css"><script defer src="feedback.js"></script></head>
<body><main><header><a href="../">朝のAI・業界ニュース便へ</a><p class="eyebrow">14日間の小さな実験 · AIホストの会話</p>
<h1>{{TITLE}}</h1><p>{{DESCRIPTION}}</p><p>{{STATUS}}</p><p><a href="feed.xml">この番組のRSSを購読</a></p></header>
<section aria-label="実験のメモ" class="notes"><h2>聴いたあとの、ひと言</h2>
<p>回答は任意。このブラウザーだけに保存し、送信しません。翌日に思い出した話を残しても構いません。聴けない日があっても大丈夫です。</p>
<p>音声をアプリで聴いた日も、このページでメモできます。別の端末には引き継がれません。</p>
<p id="feedback-summary" aria-live="polite"></p><button id="export-feedback" type="button">回答をJSONで保存</button> <button id="clear-feedback" type="button">この端末の回答を削除</button>
<output id="storage-status" aria-live="polite"></output></section>
<section aria-label="エピソード">{{EPISODES}}</section>
<footer><p>実在の話を資料に基づいてAIが構成・合成しています。出典で確かめたり、ご自身で続きをたどったりできます。</p></footer>
</main></body></html>
